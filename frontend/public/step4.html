<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Tech 2030 | Final Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #10b981;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --border: #374151;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            line-height: 1.8;
        }

        #pBar {
            position: fixed;
            top: 0; left: 0; height: 5px;
            background: linear-gradient(to right, var(--accent), #3b82f6);
            width: 0%; z-index: 10000;
        }

        header {
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 999;
            display: flex; justify-content: space-between; align-items: center;
        }

        .timer-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .ad-slot {
            background: #000;
            border: 1px solid var(--border);
            margin: 35px 0;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .ad-label { font-size: 10px; color: #4b5563; margin-bottom: 10px; letter-spacing: 2px; }

        h1 { font-size: 3.2rem; font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
        .meta { color: var(--text-dim); margin-bottom: 50px; font-size: 0.9rem; border-bottom: 1px solid var(--border); padding-bottom: 20px;}

        h2 { font-size: 1.8rem; color: var(--accent); margin-top: 50px; }
        .blog-img { width: 100%; border-radius: 16px; margin: 25px 0; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        .final-box {
            background: var(--card);
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            margin: 60px 0;
            border: 1px solid var(--border);
        }

        .btn-final {
            background: var(--accent);
            color: #000;
            padding: 22px 60px;
            font-size: 1.3rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .btn-final:hover { transform: scale(1.05); filter: brightness(1.2); }
    </style>
</head>
<body>

<div id="pBar"></div>

<header>
    <div style="font-weight: 800; font-size: 1.5rem;">TECH<span style="color:var(--accent)">2030</span></div>
    <div class="timer-badge" id="timer-ui">FINAL SYNC: <span id="sec">20</span>s</div>
</header>

<div class="container">
    <div class="ad-slot"><div class="ad-label">ADVERTISEMENT</div></div>

    <article>
        <h1>The Singularity: Life Beyond 2030</h1>
        <div class="meta">Expert Analysis • Dec 29, 2025 • 20 Min Read</div>

        <section>
            <p>We are standing at the threshold of the most significant change in human history...</p>
            <h2>1. Humanoid Revolution</h2>
            <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&q=80&w=1000" class="blog-img" alt="Humanoid Robots">
        </section>

        <div class="ad-slot"><div class="ad-label">ADVERTISEMENT</div></div>

        <div class="final-box">
            <p id="status-msg" style="color:var(--text-dim); margin-bottom:25px;">Please wait for security sync...</p>
            <button class="btn-final" id="final-btn" onclick="handleFinalRedirect()">Get Final Destination Link</button>
        </div>
    </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.0/fingerprint2.min.js"></script>

<script>
    const API_BASE = "https://api.kinglinky.com";
    let timeLeft = 20;
    let didUserScroll = false;
    let startTime = Date.now();

    const secDisp = document.getElementById("sec");
    const pBar = document.getElementById("pBar");
    const finalBtn = document.getElementById("final-btn");
    const statusMsg = document.getElementById("status-msg");

    window.addEventListener("scroll", () => didUserScroll = true);
    window.addEventListener("touchstart", () => didUserScroll = true);

    const timer = setInterval(() => {
        timeLeft--;
        if(timeLeft >= 0) secDisp.innerText = timeLeft;
        
        let progress = ((20 - timeLeft) / 20) * 100;
        pBar.style.width = progress + "%";

        if (timeLeft <= 0) {
            clearInterval(timer);
            if (!didUserScroll) {
                alert("Please scroll down to verify you are human.");
                timeLeft = 5; 
            } else {
                document.getElementById("timer-ui").innerHTML = "✅ VERIFIED";
                statusMsg.innerHTML = "Security check complete. Link generated!";
                finalBtn.style.display = "inline-block";
            }
        }
    }, 1000);

    // MUKKIAMANA REDIRECT LOGIC
    async function handleFinalRedirect() {
        finalBtn.innerText = "REDIRECTING...";
        finalBtn.disabled = true;

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if(!code) {
            alert("Security Error: Code missing!");
            return;
        }

        try {
            // Fingerprint generate panrom
            const components = await new Promise(resolve => Fingerprint2.get(resolve));
            const fingerprint = Fingerprint2.x64hash128(components.map(c => c.value).join(''), 31);
            const duration = Math.floor((Date.now() - startTime) / 1000);

            // Backend-ku request anupurom
            const response = await fetch(`${API_BASE}/api/track/final`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    code: code,
                    fingerprint: fingerprint,
                    duration: duration 
                })
            });

            const data = await response.json();

            if (data.success && data.redirect) {
                // Backend-la irundhu vara real URL-ku redirect aagum
                window.location.href = data.redirect;
            } else {
                alert(data.message || "Verification Failed. Try again.");
                finalBtn.innerText = "Get Final Destination Link";
                finalBtn.disabled = false;
            }
        } catch (err) {
            console.error(err);
            alert("Network Error. Check if your backend is running.");
            finalBtn.disabled = false;
        }
    }
</script>
</body>
</html>
