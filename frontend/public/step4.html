<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Tech 2030 | Final Step</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030712; --accent: #10b981; --text-main: #f3f4f6; --border: #1e293b; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        #pBar { position: fixed; top: 0; height: 5px; background: linear-gradient(to right, var(--accent), #3b82f6); width: 0%; z-index: 10000; transition: width 0.3s; }
        header { background: rgba(3, 7, 18, 0.95); padding: 15px 5%; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; }
        .timer-badge { border: 1px solid var(--accent); padding: 8px 16px; border-radius: 8px; color: var(--accent); font-weight: 800; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .blog-img { width: 100%; border-radius: 16px; margin: 35px 0; border: 1px solid var(--border); }
        .btn-ready { background: var(--accent); color: #000; padding: 20px 45px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; display: none; width: 100%; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="pBar"></div>
    <header>
        <div style="font-weight: 800; font-size: 1.4rem;">TECH<span style="color:var(--accent)">2030</span></div>
        <div class="timer-badge" id="timer-ui">SCANNING: <span id="sec">25</span>s</div>
    </header>

    <div class="container">
        <h1>The Great Convergence: 2030</h1>
        <p>As we approach 2030, the boundaries between physical reality and digital simulation are dissolving...</p>
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1000" class="blog-img">

        <div style="margin: 20px 0; text-align: center;">
            <script type="text/javascript">atOptions={'key':'d41be1e917eb87afabc417d7885c1eb3','format':'iframe','height':250,'width':300,'params':{}};</script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/d41be1e917eb87afabc417d7885c1eb3/invoke.js"></script>
        </div>

        <div style="background: #0a0f1d; padding: 40px; border-radius: 20px; border: 2px solid var(--border); text-align: center;">
            <p id="status-msg">Analyzing engagement... Please scroll to bottom.</p>
            <button class="btn-ready" id="final-btn">Get Final Link</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        let timeLeft = 25, hasScrolled = false;

        window.onscroll = () => { if(window.scrollY > 400) hasScrolled = true; };

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                document.getElementById("sec").innerText = timeLeft;
                document.getElementById("pBar").style.width = ((25 - timeLeft) / 25) * 100 + "%";
            }
            if (timeLeft <= 0) {
                if (hasScrolled) {
                    clearInterval(countdown);
                    document.getElementById("timer-ui").innerHTML = "✅ VERIFIED";
                    document.getElementById("status-msg").style.display = "none";
                    document.getElementById("final-btn").style.display = "block";
                } else {
                    document.getElementById("status-msg").innerText = "⚠️ Scroll down to unlock link.";
                }
            }
        }, 1000);

        document.getElementById("final-btn").onclick = async () => {
            const btn = document.getElementById("final-btn");
            btn.innerText = "GENERATING FINAL LINK...";
            btn.disabled = true;

            try {
                // Ippo backend-ku request anuppi destination URL-ah vangrom
                const response = await fetch(`/api/get-link?code=${code}`);
                const data = await response.json();

                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert("Error: Link not found!");
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        };
    </script>
</body>
</html>
