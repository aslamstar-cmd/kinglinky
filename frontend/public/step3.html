<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO ELITE | Aerospace Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --accent: #00ffcc; --text: #e0e0e0; --border: #1a222a; }
        body { background: var(--bg); color: var(--text); font-family: 'Chakra Petch', sans-serif; margin: 0; }
        #pBar { position: fixed; top: 0; left: 0; height: 4px; background: var(--accent); width: 0%; z-index: 1000; box-shadow: 0 0 10px var(--accent); transition: width 0.3s; }
        header { background: rgba(10, 15, 20, 0.95); padding: 15px 5%; border-bottom: 1px solid var(--border); position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; }
        .timer { background: #111; padding: 5px 15px; border-right: 3px solid var(--accent); font-weight: bold; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .article-img { width: 100%; border-radius: 5px; margin: 20px 0; border: 1px solid var(--border); }
        .ad-unit { background: #080a0d; border: 1px solid var(--border); margin: 25px 0; padding: 15px; text-align: center; border-radius: 8px; }
        .launch-btn { background: var(--accent); color: #000; padding: 15px 40px; font-weight: 700; border: none; border-radius: 4px; cursor: pointer; display: none; text-transform: uppercase; width: 100%; }
    </style>
</head>
<body>
    <div id="pBar"></div>
    <header>
        <div style="font-weight:700; font-size:1.4rem; color:var(--accent);">AVIA<span style="color:#fff;">ELITE</span></div>
        <div class="timer" id="t-display">SYNCING: <span id="sec">25</span>s</div>
    </header>

    <div class="container">
        <div class="ad-unit">
            <script type="text/javascript">atOptions={'key':'d41be1e917eb87afabc417d7885c1eb3','format':'iframe','height':250,'width':300,'params':{}};</script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/d41be1e917eb87afabc417d7885c1eb3/invoke.js"></script>
        </div>

        <article>
            <h1>Mach 5 & The Hypersonic Shift</h1>
            <p>Traditional jet engines are hitting their physical limits. In 2026, the focus has shifted entirely to scramjet technology...</p>
            <img src="https://images.unsplash.com/photo-1517976384346-3136801d605d?q=80&w=1000" class="article-img">
        </article>

        <div style="text-align: center; padding: 40px 0;">
            <p id="status-msg" style="color:#888;">System verifying... Please scroll down.</p>
            <button class="launch-btn" id="l-btn">Access Next Module</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code"); // Step 2-vunthu vara code
        let timeLeft = 25, userScrolled = false;

        window.onscroll = () => { if(window.scrollY > 300) userScrolled = true; };

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                document.getElementById("sec").innerText = timeLeft;
                document.getElementById("pBar").style.width = ((25 - timeLeft) / 25) * 100 + "%";
            }
            if (timeLeft <= 0) {
                if (userScrolled) {
                    clearInterval(countdown);
                    document.getElementById("t-display").innerHTML = "✅ READY";
                    document.getElementById("status-msg").style.display = "none";
                    document.getElementById("l-btn").style.display = "block";
                } else {
                    document.getElementById("status-msg").innerText = "⚠️ Please scroll to verify.";
                }
            }
        }, 1000);

        document.getElementById("l-btn").onclick = () => {
            if(!code) { alert("Session Error"); return; }
            window.location.href = `/step4.html?code=${code}`;
        };
    </script>
</body>
</html>
