<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Link | Final</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #f3f4f6; margin: 0; }
    header { padding: 15px; background: #fff; text-align: center; font-weight: 800; color: #2563eb; border-bottom: 1px solid #e5e7eb; }
    .box { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; border: 2px solid #2563eb; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .timer { font-size: 50px; color: #2563eb; font-weight: 800; margin: 20px 0; }
    button { margin-top: 20px; width: 100%; padding: 18px; background: #2563eb; color: #fff; font-weight: 700; border: none; border-radius: 8px; display: none; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .status-text { color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>SECURE LINK SYSTEM</header>

<div class="box">
  <h2>Final Verification</h2>
  <div class="timer" id="timer">8</div>
  <p class="status-text">Verifying your secure connection. Please wait...</p>
  <button id="btn" onclick="go()">GET DESTINATION LINK</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.0/fingerprint2.min.js"></script>
<script>
  const API = "https://api.kinglinky.com";
  const params = new URLSearchParams(location.search);
  const code = params.get("code");

  let time = 8;
  const timerEl = document.getElementById("timer");
  const btn = document.getElementById("btn");

  const interval = setInterval(() => {
    time--;
    timerEl.textContent = time;
    if (time <= 0) {
      clearInterval(interval);
      timerEl.style.color = "#10b981";
      timerEl.textContent = "READY";
      btn.style.display = "block";
    }
  }, 1000);

  function getFP() {
    return new Promise(resolve => {
      Fingerprint2.get(c => {
        const v = c.map(i => i.value).join("");
        resolve(Fingerprint2.x64hash128(v, 31));
      });
    });
  }

  async function go() {
    if (!code) return alert("Error: Security code missing.");
    
    btn.innerText = "VERIFYING...";
    btn.disabled = true;

    try {
      const fp = await getFP();
      const res = await fetch(`${API}/api/track/final`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, fingerprint: fp })
      });

      const data = await res.json();

      // CASE 1: Normal first-time user
      if (data.success && data.redirect) {
        window.location.href = data.redirect;
      } 
      // CASE 2: Duplicate user (2nd time)
      // KingLinky API duplicate response-la redirect link iruntha athai eduthukkom
      else if (data.redirect) {
        window.location.href = data.redirect;
      }
      else {
        alert("Verification Status: " + (data.message || "Please refresh and try again."));
        btn.innerText = "RETRY";
        btn.disabled = false;
      }
    } catch (err) {
      alert("Connection error. Check your internet.");
      btn.innerText = "GET DESTINATION LINK";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
