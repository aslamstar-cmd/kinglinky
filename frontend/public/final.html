<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Verification | Secure Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card: #0f172a;
      --accent: #10b981;
      --text: #f3f4f6;
      --border: #1e293b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      max-width: 450px;
      width: 90%;
      background: var(--card);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h2 { font-weight: 800; margin-bottom: 10px; color: var(--accent); }
    .timer-circle {
      width: 100px;
      height: 100px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      margin: 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      transition: 0.3s;
    }
    .ad-slot {
      background: rgba(255,255,255,0.03);
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
      font-size: 10px;
      color: #475569;
      border: 1px dashed var(--border);
    }
    #final-btn {
      background: var(--accent);
      color: #000;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      transition: 0.3s;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
    }
    #final-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4); }
    #final-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

<div class="box">
  <h2>Final Security Check</h2>
  <p style="opacity: 0.7; font-size: 0.9rem;">Please wait while we generate your secure destination link.</p>

  <div class="ad-slot">
      ADVERTISEMENT
  </div>

  <div id="timer-box" class="timer-circle">8</div>

  <button id="final-btn" onclick="finish()">GET DESTINATION LINK</button>
  
  <p id="status" style="margin-top: 20px; font-size: 0.8rem; color: #64748b;"></p>

  <div class="ad-slot">
      ADVERTISEMENT
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.0/fingerprint2.min.js"></script>
<script>
  let timeLeft = 8;
  const timerEl = document.getElementById("timer-box");
  const btn = document.getElementById("final-btn");
  const API_BASE = "https://api.kinglinky.com";

  // Fingerprint generator
  function getFingerprint() {
    return new Promise(resolve => {
      Fingerprint2.get(components => {
        const values = components.map(c => c.value);
        resolve(Fingerprint2.x64hash128(values.join(''), 31));
      });
    });
  }

  // Countdown
  const countdown = setInterval(() => {
    timeLeft--;
    timerEl.innerText = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(countdown);
      timerEl.style.display = "none";
      btn.style.display = "block";
    }
  }, 1000);

  async function finish() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const status = document.getElementById("status");

    if (!code) return alert("Error: Invalid Session");

    btn.disabled = true;
    btn.innerText = "VERIFYING...";
    status.innerText = "Connecting to secure server...";

    try {
      const fp = await getFingerprint();
      const response = await fetch(`${API_BASE}/api/track/final`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, fingerprint: fp })
      });

      const data = await response.json();

      if (data.redirect) {
        status.innerText = "Success! Redirecting...";
        window.location.href = data.redirect;
      } else {
        status.innerText = "Verification failed or link expired.";
        btn.disabled = false;
        btn.innerText = "RETRY";
      }
    } catch (err) {
      status.innerText = "Network error. Please try again.";
      btn.disabled = false;
      btn.innerText = "RETRY";
    }
  }
</script>

</body>
</html>
