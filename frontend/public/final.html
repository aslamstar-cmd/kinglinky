<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Link | Final Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 15px; background: #fff; text-align: center; font-weight: 800; color: #2563eb; border-bottom: 1px solid #e5e7eb; letter-spacing: 1px; }
    .box { max-width: 500px; width: 90%; margin: 60px auto; background: #fff; padding: 40px 30px; border-radius: 16px; border: 2px solid #2563eb; text-align: center; box-shadow: 0 15px 35px rgba(37, 99, 235, 0.1); }
    h2 { margin-top: 0; color: #1f2937; }
    .timer { font-size: 60px; color: #2563eb; font-weight: 800; margin: 25px 0; font-variant-numeric: tabular-nums; }
    button { margin-top: 20px; width: 100%; padding: 18px; background: #2563eb; color: #fff; font-weight: 700; border: none; border-radius: 10px; display: none; cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    button:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4); }
    button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .status-text { color: #6b7280; font-size: 0.95rem; line-height: 1.5; }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>SECURE LINK SYSTEM</header>

<div class="box">
  <h2>Final Step</h2>
  <div class="timer" id="timer">8</div>
  <p class="status-text" id="status-txt">Wait for the timer to complete to get your destination link safely.</p>
  <button id="btn" onclick="go()">GET DESTINATION LINK</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.0/fingerprint2.min.js"></script>
<script>
  const API = "https://api.kinglinky.com";
  const params = new URLSearchParams(location.search);
  const code = params.get("code");

  let time = 8;
  const timerEl = document.getElementById("timer");
  const btn = document.getElementById("btn");
  const statusTxt = document.getElementById("status-txt");

  // Countdown Logic
  const interval = setInterval(() => {
    time--;
    timerEl.textContent = time;
    if (time <= 0) {
      clearInterval(interval);
      timerEl.style.color = "#10b981";
      timerEl.textContent = "READY";
      btn.style.display = "block";
      statusTxt.innerText = "Click the button below to continue.";
    }
  }, 1000);

  function getFP() {
    return new Promise(resolve => {
      if (window.requestIdleCallback) {
        requestIdleCallback(() => {
          Fingerprint2.get(c => resolve(Fingerprint2.x64hash128(c.map(i => i.value).join(""), 31)));
        });
      } else {
        setTimeout(() => {
          Fingerprint2.get(c => resolve(Fingerprint2.x64hash128(c.map(i => i.value).join(""), 31)));
        }, 500);
      }
    });
  }
async function go() {
    if (!code) return alert("Security code missing.");
    
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span> REDIRECTING...';

    try {
      const fp = await getFP();
      const res = await fetch(`${API}/api/track/final`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, fingerprint: fp })
      });

      const data = await res.json();

      // REDIRECT LOGIC: Redirect user NO MATTER WHAT if link exists
      if (data.redirect) {
        statusTxt.innerText = "Success! Opening destination...";
        window.location.href = data.redirect;
      } else {
        alert(data.message || "Link expired.");
        btn.disabled = false;
        btn.innerText = "RETRY";
      }
    } catch (err) {
      alert("Network error. Check connection.");
      btn.disabled = false;
    }
  
    
  }
</script>

</body>
</html>
