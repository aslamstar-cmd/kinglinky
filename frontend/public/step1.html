<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Tech & Gear | Official Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0a0a0a; --card-bg: #141414; --accent: #00ff88; --text-main: #ffffff; --border-color: #222; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Poppins', sans-serif; margin: 0; line-height: 1.8; }
        #pBar { position: fixed; top: 0; left: 0; height: 5px; background: linear-gradient(to right, var(--accent), #00d4ff); width: 0%; z-index: 10000; transition: width 0.3s; }
        header { background: rgba(10, 10, 10, 0.95); padding: 15px 5%; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 999; display: flex; justify-content: space-between; align-items: center; }
        .timer-badge { background: #1e1e1e; padding: 8px 15px; border-radius: 5px; border-left: 4px solid var(--accent); font-weight: bold; }
        .main-content { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .feature-img { width: 100%; border-radius: 15px; margin: 20px 0; border: 1px solid var(--border-color); }
        .btn-continue { background: var(--accent); color: #000; padding: 20px 60px; font-size: 1.2rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; display: none; width: 100%; box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3); }
        #adblock-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 99999; text-align: center; padding-top: 150px; }
    </style>
</head>
<body>
    <div id="adblock-wrapper">
        <div style="max-width: 500px; margin: auto; padding: 30px; border: 2px solid #e74c3c; border-radius: 15px;">
            <h1 style="color: #e74c3c;">AdBlock Detected!</h1>
            <p>Please disable AdBlock to access the link.</p>
            <button onclick="window.location.reload()" style="background: #2ecc71; color: white; border: none; padding: 15px 30px; cursor: pointer; border-radius: 5px;">I've Disabled It (Reload)</button>
        </div>
    </div>

    <div id="pBar"></div>
    <header>
        <div style="font-size: 1.5rem; font-weight: 800;">ELITE<span style="color: var(--accent);">BLOG</span></div>
        <div class="timer-badge" id="timer-box">Wait: <span id="sec">20</span>s</div>
    </header>

    <div class="main-content">
        <h1>The Future of AI in 2026</h1>
        <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=1000" class="feature-img">
        <p>Neural interfaces are no longer science fiction. Developers are now creating apps that respond to cognitive patterns...</p>
        
        <div style="margin-top: 50px; text-align: center;">
            <p id="msg" style="color: #888;">Scroll and wait for verification...</p>
            <button class="btn-continue" id="main-btn">Continue to Step 2</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        let timeLeft = 20, scrolled = false;

        window.addEventListener("scroll", () => { if (window.scrollY > 200) scrolled = true; });

        const timer = setInterval(() => {
            timeLeft--;
            if(timeLeft >= 0) {
                document.getElementById("sec").innerText = timeLeft;
                document.getElementById("pBar").style.width = ((20 - timeLeft) / 20) * 100 + "%";
            }
            if (timeLeft <= 0) {
                if (scrolled) {
                    clearInterval(timer);
                    document.getElementById("timer-box").innerHTML = "✅ Verified";
                    document.getElementById("msg").style.display = "none";
                    document.getElementById("main-btn").style.display = "block";
                } else {
                    document.getElementById("msg").innerText = "⚠️ Please scroll down to verify.";
                }
            }
        }, 1000);

        document.getElementById("main-btn").onclick = () => {
            if(!code) { alert("Code missing!"); return; }
            window.location.href = `/step2.html?code=${code}`;
        };
    </script>
</body>
</html>
