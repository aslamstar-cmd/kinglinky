<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Auto Hub | Step 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #020617; --card-bg: #0f172a; --accent: #22d3ee; --text-main: #f1f5f9; --border: #1e293b; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Outfit', sans-serif; margin: 0; }
        #pBar { position: fixed; top: 0; height: 4px; background: linear-gradient(to right, var(--accent), #818cf8); width: 0%; z-index: 10000; }
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); padding: 15px 6%; border-bottom: 1px solid var(--border); position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { background: rgba(34, 211, 238, 0.1); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--accent); }
        .main-wrapper { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .blog-image { width: 100%; border-radius: 20px; margin: 25px 0; border: 1px solid var(--border); }
        .btn-next { background: var(--accent); color: #020617; padding: 20px 50px; font-size: 1.2rem; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; display: none; width: 100%; }
    </style>
</head>
<body>
    <div id="pBar"></div>
    <header>
        <div style="font-weight: 800; font-size: 1.4rem;">ELITE<span style="color:var(--accent)">HUB</span></div>
        <div class="status-badge" id="timer-ui">Analyzing: <span id="sec">20</span>s</div>
    </header>

    <div class="main-wrapper">
        <h1>Autonomous Evolution: The Automotive Shift</h1>
        <img src="https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?q=80&w=1000" class="blog-image">
        <p>The year 2025 marks a massive turning point for the automotive industry...</p>

        <div style="text-align: center; margin-top: 40px;">
            <p id="instruction" style="color: #94a3b8;">Scroll and wait for verification...</p>
            <button class="btn-next" id="next-btn">Continue to Step 3</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        let timeLeft = 20, userActive = false;

        window.addEventListener("scroll", () => userActive = true);

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) document.getElementById("sec").innerText = timeLeft;
            document.getElementById("pBar").style.width = ((20 - timeLeft) / 20) * 100 + "%";

            if (timeLeft <= 0) {
                if (userActive) {
                    clearInterval(countdown);
                    document.getElementById("timer-ui").innerHTML = "✅ Verified";
                    document.getElementById("instruction").style.display = "none";
                    document.getElementById("next-btn").style.display = "block";
                } else {
                    document.getElementById("instruction").innerText = "⚠️ Please scroll down.";
                }
            }
        }, 1000);

        document.getElementById("next-btn").onclick = () => {
            if(!code) { alert("Session Expired"); return; }
            window.location.href = `/step3.html?code=${code}`;
        };
    </script>
</body>
</html>
