<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aviation Elite | Step 3</title>
  <style>
    :root { --bg: #061c1c; --card: #0b3d3d; --accent: #00ffd0; --text: #eafffa; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
    .sticky-header { position: sticky; top: 0; background: var(--card); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); }
    .container { max-width: 700px; margin: 20px auto; background: var(--card); padding: 25px; border-radius: 15px; }
    #btn { padding: 15px 45px; background: var(--accent); color: #061c1c; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; display: none; width: 100%; }
  </style>
</head>
<body>
<div class="sticky-header">Step 3: Verification <span id="sec">15</span>s</div>
<div class="container">
  <h1>Fastest Fighter Jets of 2025</h1>
  <img src="https://images.unsplash.com/photo-1517976384346-3136801d605d?auto=format&fit=crop&q=80&w=700" style="width:100%; border-radius:10px;">
  <button id="btn" onclick="next()">Continue to Final Step</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get("code");

let s = 15;
const t = setInterval(()=>{
  s--;
  document.getElementById("sec").innerText = s;
  if(s <= 0){
    clearInterval(t);
    document.getElementById("btn").style.display="block";
  }
}, 1000);

function next(){
  if(!code) { alert("Code missing!"); return; }
  window.location.href = `step4.html?code=${code}`;
}
</script>
</body>
</html>
