<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Auto | Step 2</title>
  <style>
    :root { --bg: #061c1c; --card: #0b3d3d; --accent: #00ffd0; --text: #eafffa; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
    .sticky-header { position: sticky; top: 0; z-index: 1000; background: var(--card); padding: 15px; border-bottom: 2px solid var(--accent); }
    #sec { font-weight: bold; color: var(--accent); font-size: 1.4rem; }
    .container { max-width: 700px; margin: 20px auto; background: var(--card); padding: 25px; border-radius: 15px; text-align: left; }
    .ad-space { background: rgba(0,0,0,0.3); height: 250px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin: 30px 0; border: 1px dashed #1a4a4a; font-size: 12px; }
    .car-img { width: 100%; border-radius: 10px; margin: 15px 0; }
    #btn { padding: 15px 40px; background: var(--accent); color: #061c1c; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; display: none; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

<div class="sticky-header">
  Step 2: Verification <span id="sec">15</span> seconds...
</div>

<div class="container">
  <h1>The Future of Speed: Top Luxury Cars of 2025</h1>
  <div class="ad-space">-- Sponsored Ad --</div>
  <h2>Porsche Taycan Turbo GT</h2>
  <img src="https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&q=80&w=700" class="car-img" alt="Luxury Car">
  <div class="ad-space">-- Sponsored Ad --</div>
  <button id="btn" onclick="next()">Continue to Step 3</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get("code");

let s = 15;
const t = setInterval(()=>{
  s--;
  document.getElementById("sec").innerText = s;
  if(s <= 0){
    clearInterval(t);
    document.getElementById("btn").style.display="block";
  }
}, 1000);

function next(){
  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.innerText = "Securing Connection...";
  if(!code) { alert("Session Expired"); return; }
  setTimeout(()=> {
    window.location.href = `step3.html?code=${code}`;
  }, 2000);
}
</script>
</body>
</html>
