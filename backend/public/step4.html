<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Future Tech | Final Step</title>
  <style>
    :root { --bg: #061c1c; --card: #0b3d3d; --accent: #00ffd0; --text: #eafffa; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
    .sticky-header { position: sticky; top: 0; background: var(--card); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); }
    .container { max-width: 700px; margin: 20px auto; background: var(--card); padding: 25px; border-radius: 15px; }
    #btn { padding: 18px 50px; background: var(--accent); color: #061c1c; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; display: none; width: 100%; }
  </style>
</head>
<body>
<div class="sticky-header">Final Step: Verification <span id="sec">15</span>s</div>
<div class="container">
  <h1>Advanced Technology 2030</h1>
  <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&q=80&w=700" style="width:100%; border-radius:10px;">
  <button id="btn" onclick="finish()">Get Final Link</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get("code");

let s = 15;
const t = setInterval(()=>{
  s--;
  document.getElementById("sec").innerText = s;
  if(s <= 0){
    clearInterval(t);
    document.getElementById("btn").style.display="block";
  }
}, 1000);

function finish(){
  document.getElementById("btn").innerText = "Generating Link...";
  if(!code) { alert("Error!"); return; }
  setTimeout(()=> {
    window.location.href = `final.html?code=${code}`;
  }, 2000);
}
</script>
</body>
</html>
